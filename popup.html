<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוקב זמן</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>📊 עוקב זמן</h1>

        <div class="stats">
            <div class="stat-box">
                <h3>שימוש היום</h3>
                <p id="totalTime" class="time-display">0 דקות</p>
            </div>
            <div class="stat-box">
                <h3>הגבלה יומית</h3>
                <p id="dailyLimit" class="time-display">2 שעות</p>
            </div>
        </div>

        <div class="current-site">
            <h3>אתר נוכחי</h3>
            <p id="currentSite">---</p>
            <p id="siteTime">0 דקות</p>
        </div>

        <div id="warning" class="warning" style="display: none;">
            ⚠️ אתה מתקרב להגבלה היומית!
        </div>

        <div class="buttons">
            <button id="resetBtn" class="btn btn-secondary">אפס היום</button>
            <button id="reportsBtn" class="btn btn-primary">📈 דוחות</button>
            <button id="settingsBtn" class="btn btn-primary">⚙️ הגדרות</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
