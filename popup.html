<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוקב זמן</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">

        <div class="header">
            <span class="header-title">⏱ עוקב זמן</span>
            <button id="settingsBtn" class="settings-btn">⚙️ הגדרות</button>
        </div>

        <div class="ring-section">
            <svg class="ring" viewBox="0 0 120 120">
                <circle class="ring-bg" cx="60" cy="60" r="50"/>
                <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="50"
                    stroke-dasharray="314" stroke-dashoffset="314"/>
            </svg>
            <div class="ring-content">
                <div id="totalTime" class="ring-time">00:00</div>
                <div id="usagePct" class="ring-pct">0%</div>
                <div id="dailyLimit" class="ring-limit">מתוך 2 שעות</div>
            </div>
        </div>

        <div id="warning" class="warning" style="display:none;">
            ⚠️ מתקרבים להגבלה היומית!
        </div>

        <div id="streakBar" class="streak-bar" style="display:none;"></div>

        <div id="pauseBar" class="pause-bar" style="display:none;">
            ⏸ מעקב מושהה — <span id="pauseCountdown"></span>
            <button id="resumeBtn" class="btn-resume">המשך עכשיו</button>
        </div>

        <div class="buttons">
            <button id="resetBtn" class="btn btn-secondary">🔄 אפס</button>
            <button id="pauseBtn" class="btn btn-pause">⏸ השהה</button>
            <button id="reportsBtn" class="btn btn-primary">📈 דוחות</button>
        </div>

        <div id="pauseOptions" class="pause-options" style="display:none;">
            <button class="pause-time-btn" data-minutes="15">15 דק'</button>
            <button class="pause-time-btn" data-minutes="30">30 דק'</button>
            <button class="pause-time-btn" data-minutes="60">שעה</button>
        </div>

    </div>
    <script src="popup.js"></script>
</body>
</html>
