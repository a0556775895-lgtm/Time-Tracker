<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>אתר חסום</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            background: white; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 480px; width: 100%;
            padding: 40px; text-align: center;
        }
        .icon { font-size: 72px; margin-bottom: 20px; }
        h1 { color: #ff5252; font-size: 28px; margin-bottom: 12px; }
        .domain { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 16px; }
        .message { color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block; padding: 12px 28px;
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-back { background: #e0e0e0; color: #333; margin-left: 10px; }
        .btn-unblock { background: #ff6b6b; color: white; }
        #unblockSection { margin-top: 20px; }
        #countdown { font-size: 13px; color: #999; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <h1>אתר חסום</h1>
        <div class="domain" id="domainName"></div>
        <div class="message" id="blockMessage">בחרת לחסום את האתר הזה</div>
        <button class="btn btn-back" id="backBtn">← חזור</button>
        <div id="unblockSection" style="display:none;">
            <button class="btn btn-unblock" id="unblockBtn">🔓 שחרר זמנית</button>
            <div id="countdown"></div>
        </div>
    </div>
    <script src="blocked.js"></script>
</body>
</html>
