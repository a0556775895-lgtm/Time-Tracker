<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            padding: 15px;
        }
        .timer-box {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            width: 100%;
        }
        .label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        .time {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin: 15px 0;
            letter-spacing: 2px;
        }
        .progress {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.5s, background 0.3s;
            width: 0%;
        }
        .percentage {
            font-size: 13px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="timer-box">
        <div class="label">⏱️ שימוש היום</div>
        <div class="time" id="time">00:00:00</div>
        <div class="progress">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="percentage">
            <span id="percentage">0%</span> מהגבלה
        </div>
    </div>

    <script src="timer.js"></script>
</body>
</html>
